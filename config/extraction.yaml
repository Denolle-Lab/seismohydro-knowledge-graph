# Used from milestones M3 and M4, and by `shkg extract llm` on small sets such as the starter 100.
#
# Haiku 5.5 is the extractor, decided by the PI on 2026-11-03 to keep costs down.
# The gold set checks it against the thresholds below. Fallback models run on the gold set only
# if Haiku fails, and moving bulk extraction to one of them is a separate decision.
#
# Models plug in here. `--provider` picks one; adapters are in src/seismohydro_kg/extract/providers.
# Every provider gets the same prompt and the same checks on its output (ADR 0007).
default_provider: claude
providers:
  claude:
    adapter: claude
    model: claude-haiku-5-5
    thinking: adaptive
    effort: low
    prompt_caching: true
  olmo:
    # Any OpenAI-compatible server. Model ID and context length read from Hugging Face 2026-11-05.
    # No custom code required by its config. Not yet run on this project's text.
    adapter: openai_compatible
    model: allenai/Olmo-3-7B-Instruct
    # Port chosen to avoid 8000, which other tools commonly hold. Override with SHKG_LOCAL_BASE_URL.
    base_url: http://127.0.0.1:18000/v1

# Used by `shkg extract llm` for every provider.
max_output_tokens: 8000
# Self-reported scores are not calibrated, so LLM edges carry this until the gold set scores them.
unscored_confidence: 0.5
# Real-time calls cost twice the batch price, so metered runs above this size wait for M4 batches.
realtime_work_limit: 1000
# Placeholder set from docs/node-types.md and docs/design.md. M3 derives and freezes the real one.
provisional_predicates:
  uses_method_on: A method is applied to a target variable, compartment or setting.
  measures: A sensor, observable or method measures a variable.
  responds_to: A variable or observable changes in response to a forcing.
  proxy_for: An observable is used to infer a variable it does not directly measure.
  addresses_task: The study (WORK) carries out a task such as detection or forecasting.
  reports_gap: The study (WORK) states a limitation or unmet need.
  studied_in: The study (WORK) was done in a setting, region, compartment or event.
  informs_decision: The study (WORK) states use for a decision or decision domain.

bulk_model: claude-haiku-5-5
fallback_models:
  - claude-sonnet-5-5
  - claude-opus-5-5
# Thinking tokens bill as output and the cost table assumes none. Haiku 5.5 thinks by default.
# The Claude API reference advises lowering effort instead of disabling thinking: at low effort it
# can skip thinking on simple requests, and with thinking off it can skip a needed tool call when
# the request also asks for JSON. Measure token use and accuracy at low and medium on the gold set.
thinking: adaptive
effort: low
# Cache the shared prompt and schema. Check cache_read_input_tokens in the first batch, because
# a prefix under the model's minimum (512 tokens for Haiku 5.5) silently does not cache.
prompt_caching: true

thresholds:
  entity_precision: 0.85
  relation_precision: 0.75

# Assumptions behind the cost table in ROADMAP.md. Replace with measured values at M4.
cost_assumptions:
  input_tokens_per_abstract: 1850
  cached_tokens_per_abstract: 1500
  output_tokens_per_abstract: 400
  batch_discount: 0.5
  # USD per million tokens, from the claude-api reference table cached 2026-10-06.
  price_usd_per_mtok:
    claude-haiku-5-5: { input: 0.10, output: 0.50 }
    claude-sonnet-5-5: { input: 2.00, output: 10.00 }
    claude-opus-5-5: { input: 4.00, output: 20.00 }

# M3. Open extraction before the schema is frozen: types are suggested, the vocabulary is not fixed.
# Sampled by the work-level interdisciplinarity score from M2 for the high_score_bridge stratum.
discovery_sample:
  seismology_only: 1000
  hydrology_only: 1000
  high_score_bridge: 1000
  application: 1000

# M4. 300 abstracts. Annotate before seeing any LLM output, with pre-2015 works in every stratum.
gold_set:
  strata:
    bridge_keyword: 100  # across the 11 mechanisms and the 4 application sets
    bridge_citation: 50  # cites both fields, no keyword hit; needs the M2 citation graph
    seismology_only: 60
    hydrology_only: 60
    hard_negative: 30  # seismic dam design, electrical "discharge", water treatment
  prompt_tuning_holdout: 50  # used for tuning prompts, excluded from scoring

# M4. Which abstracts the LLM reads. Vocabulary matching runs on every work.
tiers:
  full_sets: [bridge_keyword_and, seismology_topics_x_hydro_keyword, hydrology_topics_x_seismo_keyword]
  sampled_sets:
    core_fraction: 0.05  # seismology_core, hydrology_core
    application_fraction: 0.20  # resource_management, disaster_management, landslides, subsurface_operations
  stratify_by: [domain, publication_decade, primary_source]
