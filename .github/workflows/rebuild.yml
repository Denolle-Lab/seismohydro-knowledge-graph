name: rebuild

# Full re-pull after each quarterly OpenAlex snapshot (second Wednesday of Jan, Apr, Jul, Oct).
# Costs up to $1.86, more than the $1 free daily budget, and a runner cannot resume on a later
# day. So it needs a prepaid balance, and daily_usd must be raised to cover the run.
# Scheduled runs stay off until ENABLE_SCHEDULED_RUNS is true.

on:
  schedule:
    - cron: "0 6 20 1,4,7,10 *"
  workflow_dispatch:
    inputs:
      max_usd:
        description: Spending cap for this run, in USD
        default: "2.00"

permissions:
  contents: read

jobs:
  rebuild:
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_SCHEDULED_RUNS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    env:
      OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
      MAX_USD: ${{ inputs.max_usd || '2.00' }}
      SHKG_OPENALEX_DAILY_USD: ${{ inputs.max_usd || '2.00' }}
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run shkg ingest --max-usd "$MAX_USD"
      - run: uv run shkg graph build
      - run: uv run shkg graph validate
      # Tables and manifests only. Raw records hold abstract indexes and must never be uploaded.
      - uses: actions/upload-artifact@v7
        with:
          name: graph-tables
          retention-days: 90
          path: |
            data/graph/*.parquet
            data/manifests/
