name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run shkg ontology validate
      - run: uv run shkg graph build --fixture
      - run: uv run shkg graph validate --fixture
      - name: Roadmap parses
        run: uv run python scripts/bootstrap_github.py --offline
