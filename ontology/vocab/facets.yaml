  - {id: "shared:disaster_management", concept_type: DecisionDomain, label: disaster management, status: seed, definition: Decisions to prepare for and respond to hazards.}
  - {id: "shared:subsurface_operations", concept_type: DecisionDomain, label: subsurface energy and storage operations, status: seed, definition: "Decisions about injecting, storing or extracting fluids and heat underground."}

  # Decisions
  - {id: "shared:groundwater_allocation", concept_type: Decision, label: groundwater allocation, status: seed, broader: ["shared:resource_management"]}
