  - {id: "shared:arid_basin", concept_type: Setting, label: arid basin, status: seed, synonyms: [semi-arid basin]}
  - {id: "shared:agricultural_basin", concept_type: Setting, label: agricultural basin, status: seed, synonyms: [irrigated basin]}
  - {id: "shared:mountain_catchment", concept_type: Setting, label: mountain catchment, status: seed, synonyms: [alpine catchment]}
  - {id: "shared:urban_area", concept_type: Setting, label: urban area, status: seed}
